services:
  vless-exit:
    image: nevalashka/vless-reality-exit:0.2
    container_name: vless-exit
    restart: unless-stopped
    environment:
      - VLESS_PORT=443
      - REALITY_SNI=www.microsoft.com         # заменить на соседа по подсети, см. README → «Выбор SNI»
      # - REALITY_TARGET=1.2.3.4:443           # IP сайта из SNI (по умолчанию = SNI:443)
      # - XHTTP_PORT=8443                      # включить запасной транспорт xhttp
      - BLOCK_TORRENT=true                    # меньше abuse-жалоб хостеру
      # - PUBLIC_HOST=1.2.3.4                  # если автоопределение IP не сработает
      # Ключи/UUID/shortId генерируются автоматически и хранятся в ./xray-data.
      # Задать вручную: VLESS_UUID, REALITY_PRIVATE_KEY, REALITY_SHORT_ID
    volumes:
      - ./xray-data:/data
    ports:
      - "0.0.0.0:443:443/tcp"
      # - "0.0.0.0:8443:8443/tcp"             # если включён XHTTP_PORT
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
